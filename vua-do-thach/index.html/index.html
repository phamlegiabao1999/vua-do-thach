<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Vua Đổ Thạch</title>
  
  <!-- Khai báo Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#161b22">

  <!-- Meta Tags đặc thù cho iOS (iPhone/iPad) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vua Đổ Thạch">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="game-wrapper">
    <!-- Giao diện game giữ nguyên -->
  </div>

  <!-- Đăng ký Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('Service Worker PWA đã kích hoạt:', reg.scope))
          .catch(err => console.error('Lỗi đăng ký Service Worker:', err));
      });
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
